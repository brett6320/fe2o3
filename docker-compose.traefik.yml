# fe2o3 behind Traefik — template.
# Assumes:
#   - an external Traefik network named "traefik" (adjust to yours)
#   - cert resolver "letsencrypt-prd"
#   - the "web" (HTTP) entrypoint already redirects to "websecure" globally,
#     so only the websecure router is declared here
#
# No secrets live in this file:
#   - app secrets (database URL with password) come from ./fe2o3.env
#     → copy fe2o3.env.example to fe2o3.env  (gitignored)
#   - the postgres password is a Docker secret read from ./secrets/db_password
#     → copy secrets/db_password.example to secrets/db_password  (gitignored)
# Keep the password in fe2o3.env's FE2O3_DATABASE_URL in sync with secrets/db_password.
# Replace fe2o3.example.com before use.

services:
  fe2o3:
    # Pull the published image and always fetch the newest digest on `up`.
    image: ghcr.io/brett6320/fe2o3:latest
    pull_policy: always
    # To build locally instead, comment the two lines above and uncomment:
    #   build: .
    # …but then a plain `up -d` reuses the cached image — rebuild explicitly:
    #   docker compose -f docker-compose.traefik.yml build --no-cache fe2o3
    restart: unless-stopped
    environment:
      FE2O3_BASE_URL: https://fe2o3.example.com   # required for passkeys (WebAuthn RP ID)
    env_file:
      - fe2o3.env
    volumes:
      - fe2o3-data:/data                          # git repos + keyring (keys.json)
    networks:
      - traefik
      - internal
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.fe2o3.rule=Host(`fe2o3.example.com`)
      - traefik.http.routers.fe2o3.entrypoints=websecure
      - traefik.http.routers.fe2o3.tls=true
      - traefik.http.routers.fe2o3.tls.certresolver=letsencrypt-prd
      - traefik.http.services.fe2o3.loadbalancer.server.port=8442
      # SSE (live dashboard): disable response buffering so events flush immediately
      - traefik.http.middlewares.fe2o3-flush.buffering.maxResponseBodyBytes=0
      - traefik.http.routers.fe2o3.middlewares=fe2o3-flush

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fe2o3
      POSTGRES_DB: fe2o3
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fe2o3 -d fe2o3"]
      interval: 5s
      timeout: 3s
      retries: 10

secrets:
  db_password:
    file: ./secrets/db_password

volumes:
  fe2o3-data:
  pg-data:

networks:
  traefik:
    external: true
  internal:
