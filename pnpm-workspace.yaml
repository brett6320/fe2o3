packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  argon2: true
  "@biomejs/biome": true
  ssh2: true
  cpu-features: true
overrides:
  # CVE-2026-14257: DoS via memory exhaustion; patched in 5.0.8
  brace-expansion@5: 5.0.8
  # GHSA-67mh-4wv8-2f99 (esbuild dev-server): bump the transitive esbuild that
  # drizzle-kit's @esbuild-kit loader pulls (<= 0.24.2) to a patched release.
  esbuild@<0.25.0: 0.25.12
